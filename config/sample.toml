[scanner]
# Directories to scan for Quadlet .container files (recursive)
directories = [
    "/etc/containers/systemd",
    "/home/user/.config/containers/systemd",
]

# Files and directories to skip, relative to each scan root
# Uses filepath.Match glob syntax (no recursive "**")
exclude = []

[registry.aliases]
# The following alias is built in and always enforced
# Use it as an example of the expected syntax
# "docker.io" = "registry-1.docker.io"
